name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    runs-on: [self-hosted, Linux, X64, cohort3]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy

      - name: Check code format (ruff)
        run: ruff format --check src/ tests/

      - name: Lint code (ruff)
        run: ruff check src/ tests/

      # TẠM THỜI KHÔNG CHẶN MERGE — src/ đang còn 96 lỗi mypy, phần lớn ở tầng
      # SQLAlchemy/FastAPI (Column[...] gán vào giá trị Python, Result.get,
      # untyped defs). Bắt chặn ngay bây giờ nghĩa là không ai merge được gì cho
      # tới khi dọn xong cả 96 lỗi. Kết quả vẫn hiện trong log để theo dõi tiến
      # độ; khi số lỗi về 0 thì bỏ dòng continue-on-error này đi.
      - name: Type checking (mypy)
        run: mypy src/
        continue-on-error: true

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  frontend-lint-and-build:
    runs-on: [self-hosted, Linux, X64, cohort3]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend code
        run: npm run lint

      - name: Build frontend (Type check & Vite build)
        run: npm run build

