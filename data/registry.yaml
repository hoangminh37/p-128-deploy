# =============================================================================
# REGISTRY TÀI LIỆU Y KHOA — nguồn sự thật duy nhất cho thư viện đã duyệt
# =============================================================================
# File này ĐƯỢC COMMIT vào git (khác với file PDF trong data/raw/ bị .gitignore).
# Mọi tài liệu muốn vào vector store bắt buộc phải có một mục ở đây với
# status: approved. Pipeline không tự quét thư mục — nó chỉ đọc file này.
#
# Vì sao làm vậy: brief mục 7.1 và 7.6 yêu cầu "chỉ trả lời từ thư viện đã duyệt"
# và "mọi khẳng định y khoa phải quy chiếu được về một tài liệu cụ thể". Registry
# chính là bằng chứng của việc duyệt đó, và nó nằm trong git nên mọi thay đổi
# đều đi qua Pull Request — tức là có review, đúng vai trò biên tập viên (FR4.3).
#
# Chủ sở hữu file: Khanh Nguyen (data). Thêm/sửa tài liệu phải mở PR.
# -----------------------------------------------------------------------------

version: 1

# Chính sách xếp hạng khi nhiều tài liệu cùng nói về một chủ đề.
#   recency  — tài liệu ban hành năm mới hơn được ưu tiên cao hơn (ĐANG DÙNG)
#   vn_first — tài liệu Bộ Y tế Việt Nam luôn ưu tiên hơn nguồn quốc tế
#
# Team đã chốt "recency" ngày 15/08/2026: khi ngưỡng chẩn đoán giữa các tài liệu
# mâu thuẫn nhau thì lấy số liệu của hướng dẫn mới nhất.
# Hệ quả cần biết: nguồn số 1 cho tăng huyết áp trở thành AHA/ACC 2025 (tiếng Anh),
# còn QĐ 3192 của Bộ Y tế (2010) xuống hạng thấp nhất. Đổi một dòng dưới đây là
# lật lại được toàn bộ thứ tự ưu tiên, không phải ingest lại.
ranking_policy: recency

# Tập bệnh trong phạm vi. Đây là nơi DUY NHẤT định nghĩa danh sách bệnh —
# không chỗ nào trong code viết cứng tên bệnh nữa. Thêm bệnh thứ ba chỉ cần
# thêm một mục ở đây rồi ingest lại, không phải sửa file Python nào.
#
# Mỗi bệnh cần:
#   label_vi  — tên hiển thị cho bệnh nhân, dùng trong prompt và giao diện
#   label_en  — tên tiếng Anh, để đối chiếu với tài liệu quốc tế
#   keywords  — biểu thức chính quy nhận diện chủ đề trong nội dung chunk.
#               Dùng để gắn thêm nhãn bệnh cho đoạn văn, giúp bệnh nhân mắc
#               đồng thời nhiều bệnh vẫn tìm được đoạn nói về bệnh kia.
#               Viết cả từ tiếng Việt lẫn tiếng Anh vì thư viện có cả hai.
diseases:
  type2_diabetes:
    label_vi: "đái tháo đường típ 2"
    label_en: "Type 2 diabetes"
    keywords: >-
      đái\s*tháo\s*đường|tiểu\s*đường|diabet|hba1c|insulin|metformin|
      glucose\s*máu|đường\s*huyết|glycemi|glycaemi|hyperglyc

  hypertension:
    label_vi: "tăng huyết áp"
    label_en: "Hypertension"
    keywords: >-
      tăng\s*huyết\s*áp|huyết\s*áp|hypertens|blood\s*pressure|\bbp\b|mmhg|
      antihypertens|systolic|diastolic|tâm\s*thu|tâm\s*trương

